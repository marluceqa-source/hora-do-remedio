services:
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    volumes:
      - db_data:/app/database
    restart: "no"

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - db_data:/app/database
      - uploads_data:/app/assets/uploads
      - logs_data:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    volumes:
      - db_data:/app/database
      - uploads_data:/app/assets/uploads
      - logs_data:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # IMPORTANTE (RN08, RF05): mantenha este serviço com exatamente 1 réplica.
    # O único SchedulerService (APScheduler) do sistema roda dentro deste processo;
    # escalar "bot" para 2+ réplicas duplicaria o envio de lembretes.
    deploy:
      replicas: 1

volumes:
  db_data:
  uploads_data:
  logs_data:
