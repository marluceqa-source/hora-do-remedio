tags:
- name: Saúde
  description: Verificação do estado do serviço.
- name: Autenticação
  description: Emissão de tokens de acesso à API, independentes do token do bot.
- name: Medicamentos
  description: Cadastro, consulta, atualização e exclusão de medicamentos.
- name: Agendamentos
  description: Consulta dos horários configurados para cada medicamento.
- name: Lembretes
  description: Lembretes do dia, confirmação de administração e adiamento.
- name: Histórico
  description: Consulta de doses programadas, confirmadas e não confirmadas.
- name: Relatórios
  description: Relatórios de adesão declarada, em JSON ou CSV.
- name: Cuidadores
  description: Autorização, listagem e revogação de acesso de cuidadores.
- name: Portal — Autenticação
  description: Cadastro, login em duas etapas (senha + MFA), sessão por cookie e recuperação
    de acesso para profissionais de saúde.
- name: Portal — Pacientes
  description: Cadastro de pacientes e geração de convites para vincular o paciente
    ao bot do Telegram.
- name: Portal — Tratamentos
  description: Edição, ativação, suspensão e histórico de versões de esquemas terapêuticos.
- name: Portal — Dashboard
  description: 'Painel operacional: pacientes, tratamentos e confirmações declaradas.'
- name: Portal — Administração
  description: Verificação de profissionais e consulta à trilha de auditoria (admin).
