openapi: 3.1.0
info:
  title: Hora do Remédio API
  description: 'API REST do **Hora do Remédio**: cadastro de medicamentos, agendamentos,
    lembretes, histórico e relatórios de adesão declarada.


    O bot não prescreve nem recomenda alterações de dosagem (RN13), e a confirmação
    de administração representa uma informação declarada pelo usuário, não uma comprovação
    clínica real (RF07, RN12).'
  contact:
    name: Hora do Remédio
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Desenvolvimento local
paths:
  /api/v1/auth/token:
    post:
      tags:
      - Autenticação
      summary: Emite um token de acesso para o usuário do Telegram
      description: Autenticação da API é independente do token do bot Telegram (seção
        8 do prompt master). O bot troca o telegram_user_id por um token JWT escopado
        ao usuário para chamar a API em seu nome.
      operationId: issue_token_api_v1_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/medications:
    get:
      tags:
      - Medicamentos
      summary: Lista os medicamentos do usuário autenticado (RN09)
      operationId: list_medications_api_v1_medications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Active
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationOut'
                title: Response List Medications Api V1 Medications Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Medicamentos
      summary: Cadastra um novo medicamento com seus horários (RF02)
      operationId: create_medication_api_v1_medications_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/medications/{medication_id}:
    get:
      tags:
      - Medicamentos
      summary: Consulta um medicamento
      operationId: get_medication_api_v1_medications__medication_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: medication_id
        in: path
        required: true
        schema:
          type: integer
          title: Medication Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Medicamentos
      summary: Atualiza um medicamento (CT10)
      operationId: update_medication_api_v1_medications__medication_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: medication_id
        in: path
        required: true
        schema:
          type: integer
          title: Medication Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Medicamentos
      summary: 'Exclui um medicamento (RN16: requer confirmação explícita)'
      operationId: delete_medication_api_v1_medications__medication_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: medication_id
        in: path
        required: true
        schema:
          type: integer
          title: Medication Id
      - name: confirm
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Confirm
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/schedules:
    get:
      tags:
      - Agendamentos
      summary: Consulta os agendamentos do usuário autenticado
      operationId: list_schedules_api_v1_schedules_get
      security:
      - HTTPBearer: []
      parameters:
      - name: medication_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filtra por medicamento
          title: Medication Id
        description: Filtra por medicamento
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleOut'
                title: Response List Schedules Api V1 Schedules Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reminders/today:
    get:
      tags:
      - Lembretes
      summary: Consulta os lembretes de hoje (RF09)
      operationId: reminders_today_api_v1_reminders_today_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ReminderEventOut'
                type: array
                title: Response Reminders Today Api V1 Reminders Today Get
      security:
      - HTTPBearer: []
  /api/v1/reminders/{reminder_id}/confirm:
    post:
      tags:
      - Lembretes
      summary: Confirma a administração de uma dose (RF07, RN04)
      operationId: confirm_reminder_api_v1_reminders__reminder_id__confirm_post
      security:
      - HTTPBearer: []
      parameters:
      - name: reminder_id
        in: path
        required: true
        schema:
          type: integer
          title: Reminder Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderEventOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reminders/{reminder_id}/snooze:
    post:
      tags:
      - Lembretes
      summary: Adia um lembrete sem alterar o horário original (RF08, RN06)
      operationId: snooze_reminder_api_v1_reminders__reminder_id__snooze_post
      security:
      - HTTPBearer: []
      parameters:
      - name: reminder_id
        in: path
        required: true
        schema:
          type: integer
          title: Reminder Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderSnoozeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderEventOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/history:
    get:
      tags:
      - Histórico
      summary: Consulta o histórico de doses com filtros por dia, semana ou mês (RF09)
      operationId: get_history_api_v1_history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
          default: day
          title: Period
      - name: reference_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Reference Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReminderEventOut'
                title: Response Get History Api V1 History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports:
    get:
      tags:
      - Relatórios
      summary: Consulta relatórios de adesão declarada (RF10)
      description: Retorna um resumo em JSON por padrão. Use ?format=csv para obter
        o relatório como arquivo CSV. Os números refletem confirmações declaradas
        pelo usuário, não comprovação clínica real (RN12).
      operationId: get_report_api_v1_reports_get
      security:
      - HTTPBearer: []
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: json
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            text/csv: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/caregivers:
    get:
      tags:
      - Cuidadores
      summary: Lista os cuidadores autorizados pelo usuário
      operationId: list_caregiver_access_api_v1_caregivers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CaregiverAccessOut'
                type: array
                title: Response List Caregiver Access Api V1 Caregivers Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Cuidadores
      summary: Autoriza um cuidador a acompanhar o usuário autenticado (RF12)
      operationId: grant_caregiver_access_api_v1_caregivers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverGrantRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverAccessOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/caregivers/{access_id}:
    delete:
      tags:
      - Cuidadores
      summary: Revoga o acesso de um cuidador (RF12)
      operationId: revoke_caregiver_access_api_v1_caregivers__access_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: access_id
        in: path
        required: true
        schema:
          type: integer
          title: Access Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/caregivers/patients/{patient_user_id}/medications:
    get:
      tags:
      - Cuidadores
      summary: Consulta os medicamentos de um paciente autorizado (acesso de cuidador,
        RF12)
      operationId: list_patient_medications_as_caregiver_api_v1_caregivers_patients__patient_user_id__medications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: patient_user_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationOut'
                title: Response List Patient Medications As Caregiver Api V1 Caregivers
                  Patients  Patient User Id  Medications Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/professionals:
    post:
      tags:
      - Portal — Autenticação
      summary: Solicita cadastro de profissional (RF01) — não concede permissões clínicas
        automaticamente
      operationId: signup_professional_api_v1_professionals_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionalSignupRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Portal — Administração
      summary: Lista profissionais, com filtro por status de verificação (admin)
      operationId: list_professionals_api_v1_professionals_get
      security:
      - APIKeyCookie: []
      parameters:
      - name: verification_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessionalOut'
                title: Response List Professionals Api V1 Professionals Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/professionals/me:
    get:
      tags:
      - Portal — Autenticação
      summary: Consulta o perfil do profissional autenticado
      operationId: get_my_profile_api_v1_professionals_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalOut'
      security:
      - APIKeyCookie: []
  /api/v1/auth/professional/login:
    post:
      tags:
      - Portal — Autenticação
      summary: '1ª etapa do login: valida e-mail/senha e devolve o desafio de MFA
        (RF01)'
      operationId: login_step1_api_v1_auth_professional_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallengeOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/professional/mfa/setup:
    post:
      tags:
      - Portal — Autenticação
      summary: Inicia a configuração do MFA (1º login) — renderize provisioning_uri
        como QR Code
      operationId: start_mfa_setup_api_v1_auth_professional_mfa_setup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreAuthTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/professional/mfa/confirm:
    post:
      tags:
      - Portal — Autenticação
      summary: Confirma o código TOTP e ativa o MFA, iniciando a sessão (RF01)
      operationId: confirm_mfa_setup_api_v1_auth_professional_mfa_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/professional/mfa/verify:
    post:
      tags:
      - Portal — Autenticação
      summary: '2ª etapa do login (profissionais com MFA já ativo): envia o código
        e recebe a sessão'
      operationId: verify_mfa_api_v1_auth_professional_mfa_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/professional/logout:
    post:
      tags:
      - Portal — Autenticação
      summary: Encerra a sessão atual (RF01)
      operationId: logout_api_v1_auth_professional_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - APIKeyCookie: []
  /api/v1/auth/professional/password-reset/request:
    post:
      tags:
      - Portal — Autenticação
      summary: Solicita recuperação de acesso (RF01) — não revela se o e-mail existe
      operationId: request_password_reset_api_v1_auth_professional_password_reset_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Request Password Reset Api V1 Auth Professional Password
                  Reset Request Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/professional/password-reset/confirm:
    post:
      tags:
      - Portal — Autenticação
      summary: Confirma a nova senha a partir do token de recuperação (RF01)
      operationId: confirm_password_reset_api_v1_auth_professional_password_reset_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients:
    get:
      tags:
      - Portal — Pacientes
      summary: Lista os pacientes autorizados do profissional (RN22)
      operationId: list_patients_api_v1_patients_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PatientOut'
                type: array
                title: Response List Patients Api V1 Patients Get
      security:
      - APIKeyCookie: []
    post:
      tags:
      - Portal — Pacientes
      summary: Cadastra um paciente (RF03) — quem cadastra fica automaticamente vinculado
      operationId: create_patient_api_v1_patients_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyCookie: []
  /api/v1/patients/{patient_id}:
    get:
      tags:
      - Portal — Pacientes
      summary: Consulta um paciente autorizado (RN22)
      operationId: get_patient_api_v1_patients__patient_id__get
      security:
      - APIKeyCookie: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{patient_id}/invites:
    post:
      tags:
      - Portal — Pacientes
      summary: Gera um convite único e temporário para vincular o paciente ao Telegram
        (RF04)
      operationId: create_patient_invite_api_v1_patients__patient_id__invites_post
      security:
      - APIKeyCookie: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInviteOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{patient_id}/medications:
    get:
      tags:
      - Portal — Pacientes
      summary: Lista os medicamentos/tratamentos cadastrados para o paciente (RF05)
      operationId: list_patient_treatment_medications_api_v1_patients__patient_id__medications_get
      security:
      - APIKeyCookie: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreatmentMedicationOut'
                title: Response List Patient Treatment Medications Api V1 Patients  Patient
                  Id  Medications Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Portal — Pacientes
      summary: Cadastra um medicamento/esquema terapêutico como rascunho (RF05, RN25)
      operationId: create_patient_treatment_medication_api_v1_patients__patient_id__medications_post
      security:
      - APIKeyCookie: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentMedicationCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentMedicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/patients/{patient_id}/history:
    get:
      tags:
      - Portal — Pacientes
      summary: 'Consulta o histórico de doses do paciente (RF08) — RN12: ausência
        de resposta não prova que não tomou'
      operationId: get_patient_history_api_v1_patients__patient_id__history_get
      security:
      - APIKeyCookie: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      - name: period
        in: query
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
          default: week
          title: Period
      - name: reference_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Reference Date
      responses:
        '200':
