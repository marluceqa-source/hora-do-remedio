[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = testes
# O XML vai para a pasta de resultados do projeto de Playwright, que monta o
# relatório HTML consolidado (npm run relatorio).
addopts = -ra --tb=short --junitxml=../testes-playwright/resultados/bot.xml
markers =
    dados: heurística "Ataques de Tipos de Dados"
    strings: heurística "Testes de Strings"
    crud: heurísticas gerais CRUD e "Siga os Dados"
    interrupcoes: heurística geral "Interrupções"
    contraria: sabedoria em testes "Adote abordagem contrária"
